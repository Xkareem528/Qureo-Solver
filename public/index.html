<script>

let step = 1;
let chapters = [];
let stats = {};

const panes = [1, 2, 3, 4].map(n =>
  document.getElementById('step' + n)
);

const next = document.getElementById('next');
const back = document.getElementById('back');

function render() {
  panes.forEach((pane, index) => {
    if (pane) {
      pane.classList.toggle('hidden', index !== step - 1);
    }
  });

  const stepNo = document.getElementById('stepNo');
  const stepLabel = document.getElementById('stepLabel');

  if (stepNo) {
    stepNo.textContent = String(step).padStart(2, '0');
  }

  if (stepLabel) {
    stepLabel.textContent = `الخطوة ${step} من 4`;
  }

  if (back) {
    back.classList.toggle('hidden', step === 1);
  }

  if (next) {
    next.textContent =
      step === 4 ? 'عرض التقدم ←' : 'التالي ←';
  }
}

async function loadData() {
  const responses = await Promise.all([
    fetch('/api/stats'),
    fetch('/api/chapters'),
    fetch('/api/progress')
  ]);

  if (responses.some(response => !response.ok)) {
    throw new Error('تعذر تحميل بيانات السيرفر');
  }

  const [statsData, chaptersData, progressData] =
    await Promise.all(responses.map(response => response.json()));

  if (!Array.isArray(chaptersData) ||
      !Array.isArray(progressData)) {
    throw new Error('بيانات السيرفر غير صحيحة');
  }

  stats = statsData;
  chapters = chaptersData;

  return progressData;
}

function showDashboard(progress) {
  const setup = document.getElementById('setup');
  const dashboard = document.getElementById('dashboard');

  if (!setup || !dashboard) {
    throw new Error('عناصر لوحة التحكم غير موجودة');
  }

  setup.classList.add('hidden');
  dashboard.classList.remove('hidden');

  const done = document.getElementById('done');
  if (done) done.textContent = stats.completed ?? 0;

  const stat2 = document.querySelector(
    '.stats .stat:nth-child(2) strong'
  );

  const stat3 = document.querySelector(
    '.stats .stat:nth-child(3) strong'
  );

  const label1 = document.querySelector(
    '.stats .stat:nth-child(1) small'
  );

  const label2 = document.querySelector(
    '.stats .stat:nth-child(2) small'
  );

  const label3 = document.querySelector(
    '.stats .stat:nth-child(3) small'
  );

  if (stat2) stat2.textContent = chapters.length;
  if (stat3) stat3.textContent = stats.questions ?? 0;

  if (label1) label1.textContent = 'فصول مكتملة';
  if (label2) label2.textContent = 'إجمالي الفصول';
  if (label3) label3.textContent = 'أسئلة محفوظة';

  const percent = chapters.length
    ? ((stats.completed ?? 0) / chapters.length) * 100
    : 0;

  const bar = document.getElementById('bar');

  if (bar) {
    bar.style.width = Math.min(percent, 100) + '%';
  }

  const activity = document.getElementById('activity');

  if (activity) {
    activity.textContent =
      `تم الاتصال بالسيرفر بنجاح.
عدد الفصول: ${chapters.length}
عدد الأسئلة: ${stats.questions ?? 0}
الفصول المكتملة: ${stats.completed ?? 0}`;
  }

  const sections = document.querySelectorAll(
    '#dashboard .section-title'
  );

  const section = sections.length
    ? sections[sections.length - 1]
    : null;

  const oldList = document.getElementById('chapterList');
  if (oldList) oldList.remove();

  const list = document.createElement('div');
  list.id = 'chapterList';
  list.style.margin = '15px 0';

  chapters.forEach(chapter => {
    const item = document.createElement('div');

    item.style.cssText =
      'background:#141722;border:1px solid #272a36;border-radius:14px;padding:15px;margin:9px 0;display:flex;justify-content:space-between;gap:10px';

    const title = document.createElement('span');
    title.textContent = chapter.title ?? `الفصل ${chapter.id}`;

    const status = document.createElement('span');
    status.style.color = '#9295a7';

    const chapterProgress = progress.find(
      p => Number(p.chapter_id) === Number(chapter.id)
    );

    status.textContent = chapterProgress
      ? chapterProgress.status
      : 'لم يبدأ';

    item.append(title, status);
    list.appendChild(item);
  });

  if (section) {
    section.after(list);
  } else {
    dashboard.appendChild(list);
  }
}

next.onclick = async () => {
  if (next.disabled) return;

  if (
    step === 2 &&
    !document.getElementById('student').value.trim()
  ) {
    alert('اكتب كود الطالب للمتابعة');
    return;
  }

  if (step < 4) {
    step++;
    render();
    return;
  }

  next.disabled = true;
  next.textContent = 'جاري التحميل...';

  try {
    const progress = await loadData();
    showDashboard(progress);
  } catch (error) {
    console.error(error);
    alert(error.message || 'حدث خطأ أثناء تحميل البيانات');
  } finally {
    next.disabled = false;
    next.textContent = 'عرض التقدم ←';
  }
};

back.onclick = () => {
  if (step > 1) {
    step--;
    render();
  }
};

document.getElementById('reset').onclick = () => {
  step = 1;
  render();

  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');

  document.getElementById('student').value = '';
  document.getElementById('password').value = '';
};

render();

</script>
</body>
</html>
